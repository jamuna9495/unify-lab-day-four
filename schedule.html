<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule - DevConf 2026</title>
  <style>
    /* பொதுவான ஸ்டைல்கள் */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f9f9f9;
      color: #1a2a3a;
    }

    /* Navigation Bar */
    .sticky-nav {
      background-color: white;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #1a2a3a;
    }

    .logo span {
      color: #f37021;
    }

    .flex-menu {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    .flex-menu li a {
      text-decoration: none;
      color: #666;
      font-weight: 500;
    }

    .flex-menu li a.active {
      color: #f37021;
    }

    /* Schedule Section */
    .main-shell {
      max-width: 800px; /* கால அட்டவணைக்கு குறுகிய அகலம் நன்றாக இருக்கும் */
      margin: 80px auto;
      padding: 0 20px;
    }

    .header-title {
      font-size: 3.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 60px;
      color: #1a2a3a;
    }

    /* Timeline Styling */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .time-item {
      display: flex;
      align-items: flex-start;
      gap: 40px;
    }

    .time-marker {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f37021; /* படத்தில் உள்ள ஆரஞ்சு நிற நேரம் */
      min-width: 140px;
      padding-top: 5px;
    }

    .time-content h3 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1a2a3a;
    }

    .time-content p {
      font-size: 1.2rem;
      color: #4b5563;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .time-item {
        flex-direction: column;
        gap: 10px;
      }
      .time-marker {
        min-width: auto;
      }
      .header-title {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>

  <nav class="sticky-nav">
    <div class="nav-container">
      <div class="logo">Dev<span>Conf</span></div>
      <ul class="flex-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="speakers.html">Speakers</a></li>
        <li><a href="schedule.html" class="active">Schedule</a></li>
        <li><a href="sponsors.html">Sponsors</a></li>
      </ul>
    </div>
  </nav>

  <main class="main-shell">
    <h1 class="header-title">Event Schedule</h1>
    
    <div class="timeline">
      <div class="time-item">
        <div class="time-marker">09:00 AM</div>
        <div class="time-content">
          <h3>Keynote: Future of Dev</h3>
          <p>By Sarah Chen - Main Auditorium</p>
        </div>
      </div>
      
      <div class="time-item">
        <div class="time-marker">11:30 AM</div>
        <div class="time-content">
          <h3>Workshop: Serverless Scale</h3>
          <p>By Mark Thorne - Lab 102</p>
        </div>
      </div>

      <div class="time-item highlight">
        <div class="time-marker">01:00 PM</div>
        <div class="time-content">
          <h3>Project Lunch & Networking</h3>
          <p>Terrace Garden</p>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
